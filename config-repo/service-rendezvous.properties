server.port=8083

# Base de données H2
spring.datasource.url=jdbc:h2:mem:rendezvousdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# RabbitMQ (pour le V5)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# === FEIGN & RESILIENCE4J ===
spring.cloud.openfeign.circuitbreaker.enabled=true

# Timeouts par défaut pour Feign
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=2000

# Configuration pour le service PATIENTS (nom exact de ton @CircuitBreaker)
resilience4j.circuitbreaker.instances.service-patients.sliding-window-size=10
resilience4j.circuitbreaker.instances.service-patients.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-patients.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.service-patients.ignoreExceptions=feign.FeignException$NotFound

resilience4j.retry.instances.service-patients.max-attempts=3
resilience4j.retry.instances.service-patients.wait-duration=500ms
resilience4j.retry.instances.service-patients.ignoreExceptions=feign.FeignException$NotFound
resilience4j.retry.instances.service-patients.retryExceptions=java.net.ConnectException, feign.RetryableException

# Configuration pour le service PRATICIENS (nom exact de ton @CircuitBreaker)
resilience4j.circuitbreaker.instances.service-praticiens.sliding-window-size=10
resilience4j.circuitbreaker.instances.service-praticiens.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-praticiens.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.service-praticiens.ignoreExceptions=feign.FeignException$NotFound

resilience4j.retry.instances.service-praticiens.max-attempts=3
resilience4j.retry.instances.service-praticiens.wait-duration=500ms
resilience4j.retry.instances.service-praticiens.ignoreExceptions=feign.FeignException$NotFound
resilience4j.retry.instances.service-praticiens.retryExceptions=java.net.ConnectException, feign.RetryableException