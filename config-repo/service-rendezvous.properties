server.port=8083

spring.datasource.url=jdbc:h2:mem:rendezvousdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
management.endpoints.web.exposure.include=health,info,metrics

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.cloud.openfeign.circuitbreaker.enabled=true
# Timeouts par défaut pour Feign
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=2000

# Configuration par défaut du Circuit Breaker et du Retry
resilience4j.circuitbreaker.instances.default.sliding-window-size=10
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=10s
resilience4j.retry.instances.default.max-attempts=3
resilience4j.retry.instances.default.wait-duration=500ms

# LA CORRECTION EST ICI : On ignore l'erreur 404 de Feign
resilience4j.circuitbreaker.instances.default.ignoreExceptions=feign.FeignException$NotFound
resilience4j.retry.instances.default.retryExceptions=java.net.ConnectException, feign.RetryableException