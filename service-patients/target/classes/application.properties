# Nom de l'application
spring.application.name=service-patients

# Port du service (Demandé dans le TP)
server.port=8081

# Configuration de la base de données H2 (en mémoire)
spring.datasource.url=jdbc:h2:mem:patientsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Autoriser l'accès à la console H2 via le navigateur (pour voir la BDD)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuration JPA (Hibernate) pour créer les tables automatiquement
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true